name: Flight Price Check

on:
  schedule:
    # Runs every 3 hours (UTC) at :17 past the hour. GitHub's scheduler is most
    # congested at :00, where runs get delayed by hours or dropped, so an
    # off-peak minute keeps checks closer to schedule (it can still lag a bit).
    # cron syntax: min hour day month weekday
    - cron: "17 */3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit history.json back to the repo

concurrency:
  group: repo-config-writes
  cancel-in-progress: false

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price tracker
        id: track
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python track_prices.py

      - name: Commit updated history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update flight price history [skip ci]"
          file_pattern: history.json

      # Runs after history.json is committed, so failure counters are never lost.
      # Turns the run red when any tracked route has failed 3+ checks in a row.
      - name: Fail if routes keep failing
        if: steps.track.outputs.failing_routes != '' && steps.track.outputs.failing_routes != '0'
        run: |
          echo "::error::${{ steps.track.outputs.failing_routes }} route(s) failed 3+ price checks in a row - see the 'Run price tracker' step and last_error in history.json"
          exit 1
